name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs the same checks before shipping.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Website builds
        run: node site/build.mjs /tmp/site
      - name: Server integration tests
        run: npx vitest run --root packages/server integration
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/relay_test
      - name: Docker image builds
        run: docker build -f deploy/server.Dockerfile -t session-relay:ci .

  # The same app as a Cloudflare Worker: wrangler dev (local Workers runtime, simulated R2)
  # against a real Postgres. See scripts/worker-smoke.sh and docs/cloudflare.md.
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: relay_worker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_worker"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Worker bundles
        working-directory: packages/server
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
      - name: Worker smoke test
        run: ./scripts/worker-smoke.sh
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/relay_worker

name: Publish CLI
# Publishes packages/cli to npm as `session-relay`.
# Release: bump "version" in packages/cli/package.json, merge to main, then push a tag:
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack only, don't publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w @session-relay/shared
      - run: npm run build -w session-relay
      - run: npm test -w session-relay

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          [ "cli-v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli version $v"; exit 1; }

      - name: Install the packed tarball and run it
        working-directory: packages/cli
        run: |
          set -euo pipefail
          npm pack --silent
          prefix=$(mktemp -d)
          npm install -g --prefix "$prefix" ./session-relay-*.tgz >/dev/null
          "$prefix/bin/relay" --version
          "$prefix/bin/session-relay" --help | head -3

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
